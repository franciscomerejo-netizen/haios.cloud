name: HAIOS Deno Diagnostic (Manual)

# HAIOS does not currently use Deno as a required production build path.
# This workflow is intentionally manual so unrelated pushes to main cannot
# create false-red CI signals. It runs only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Deno diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Deno project
        id: detect
        shell: bash
        run: |
          if [[ -f deno.json || -f deno.jsonc ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "DENO_PROJECT_DETECTED"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DENO_NOT_CONFIGURED: diagnostic skipped without failure"
          fi

      - name: Setup Deno
        if: steps.detect.outputs.configured == 'true'
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v1.x

      - name: Lint
        if: steps.detect.outputs.configured == 'true'
        run: deno lint

      - name: Test
        if: steps.detect.outputs.configured == 'true'
        run: deno test -A

      - name: Result
        run: |
          echo "HAIOS_DENO_DIAGNOSTIC_COMPLETE"
          echo "This workflow is not a production deployment gate unless Deno becomes an approved HAIOS runtime dependency."
