name: Amazon ECS — Manual Only / Fail Closed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: ECS preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment policy
        run: |
          echo "HAIOS ECS deployment is intentionally MANUAL ONLY."
          echo "This workflow no longer runs on every push to main."
          echo "Before enabling ECS deployment, configure real AWS/ECR/ECS values, an ECS task definition, and GitHub Actions secrets."
          echo "No deployment is attempted from placeholder configuration."

      - name: Fail closed until ECS is explicitly configured
        run: |
          echo "ECS_NOT_CONFIGURED: deployment blocked by design."
          exit 1
